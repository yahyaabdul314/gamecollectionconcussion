<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Results</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .info-box {
            background: rgba(102, 126, 234, 0.2);
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .warning-box {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .result-card {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            border-left: 5px solid #667eea;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #444;
        }

        .result-type {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
        }

        .result-date {
            color: #aaa;
            font-size: 0.9rem;
        }

        .result-score {
            display: inline-block;
            padding: 10px 20px;
            background: #333;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 5px;
        }

        .score-excellent { color: #00ff00; }
        .score-good { color: #90ee90; }
        .score-fair { color: #ffaa00; }
        .score-poor { color: #ff6b6b; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-item {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff00;
        }

        .stat-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 25px;
            margin: 5px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ff6b6b;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .btn-export {
            background: #00ff00;
            color: black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        th {
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #2a2a2a;
            border-radius: 10px;
            margin: 40px 0;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .filter-bar {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            color: #aaa;
            margin-right: 10px;
        }

        select {
            padding: 10px;
            background: #333;
            color: white;
            border: 2px solid #666;
            border-radius: 5px;
            font-size: 14px;
        }

        .summary-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .dashboard-card {
            background: linear-gradient(135deg, #667eea22 0%, #764ba222 100%);
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .dashboard-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 15px 0;
        }

        .dashboard-label {
            color: #aaa;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Assessment Results Dashboard</h1>
            <p>Track your concussion assessment history and recovery progress</p>
        </div>

        <div id="summary-section"></div>

        <div class="filter-bar">
            <span class="filter-label">Filter by Test Type:</span>
            <select id="test-filter" onchange="filterResults()">
                <option value="all">All Tests</option>
                <option value="SymptomChecklist">Symptom Checklist</option>
                <option value="BESS">Balance (BESS)</option>
                <option value="VOMS">VOMS</option>
                <option value="ReactionTime">Reaction Time</option>
                <option value="Cognitive">Cognitive</option>
            </select>

            <span class="filter-label">Sort by:</span>
            <select id="sort-order" onchange="filterResults()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
            </select>

            <div style="flex-grow: 1;"></div>

            <button class="btn btn-export" onclick="exportResults()">📥 Export All Data (JSON)</button>
            <button class="btn btn-danger" onclick="clearAllResults()">🗑️ Clear All Results</button>
        </div>

        <div id="results-container"></div>

        <div style="text-align: center; margin: 40px 0;">
            <button class="btn" onclick="window.location.href='../assessment.html'">
                ← Back to Assessment Menu
            </button>
            <button class="btn" onclick="window.location.href='../index.html'">
                ← Back to Games
            </button>
        </div>
    </div>

    <script>
        let allResults = [];

        function loadResults() {
            allResults = JSON.parse(localStorage.getItem('concussionAssessments') || '[]');
            displaySummary();
            filterResults();
        }

        function displaySummary() {
            const summarySection = document.getElementById('summary-section');

            if (allResults.length === 0) {
                summarySection.innerHTML = '';
                return;
            }

            // Calculate summary statistics
            const testCounts = {};
            allResults.forEach(result => {
                testCounts[result.testType] = (testCounts[result.testType] || 0) + 1;
            });

            const latestSymptoms = allResults.filter(r => r.testType === 'SymptomChecklist').pop();
            const latestBESS = allResults.filter(r => r.testType === 'BESS').pop();
            const latestCognitive = allResults.filter(r => r.testType === 'Cognitive').pop();

            summarySection.innerHTML = `
                <div class="info-box">
                    <h3>📊 Assessment Summary</h3>
                    <p>Total assessments completed: <strong>${allResults.length}</strong></p>
                    <p>Most recent assessment: <strong>${new Date(allResults[allResults.length - 1].timestamp).toLocaleString()}</strong></p>
                </div>

                <div class="summary-dashboard">
                    <div class="dashboard-card">
                        <div class="dashboard-label">Total Assessments</div>
                        <div class="dashboard-value" style="color: #667eea;">${allResults.length}</div>
                    </div>

                    ${latestSymptoms ? `
                        <div class="dashboard-card">
                            <div class="dashboard-label">Latest Symptom Score</div>
                            <div class="dashboard-value ${getScoreClass('symptom', latestSymptoms.totalScore)}">
                                ${latestSymptoms.totalScore}
                            </div>
                            <div style="color: #aaa; font-size: 0.9rem;">${latestSymptoms.interpretation}</div>
                        </div>
                    ` : ''}

                    ${latestBESS ? `
                        <div class="dashboard-card">
                            <div class="dashboard-label">Latest Balance Score</div>
                            <div class="dashboard-value ${getScoreClass('bess', latestBESS.totalScore)}">
                                ${latestBESS.totalScore}
                            </div>
                            <div style="color: #aaa; font-size: 0.9rem;">${latestBESS.interpretation}</div>
                        </div>
                    ` : ''}

                    ${latestCognitive ? `
                        <div class="dashboard-card">
                            <div class="dashboard-label">Latest Cognitive Score</div>
                            <div class="dashboard-value ${getScoreClass('cognitive', latestCognitive.compositeScore)}">
                                ${latestCognitive.compositeScore}%
                            </div>
                            <div style="color: #aaa; font-size: 0.9rem;">${latestCognitive.interpretation}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function getScoreClass(type, score) {
            if (type === 'symptom') {
                if (score === 0) return 'score-excellent';
                if (score <= 10) return 'score-good';
                if (score <= 30) return 'score-fair';
                return 'score-poor';
            } else if (type === 'bess') {
                if (score <= 10) return 'score-excellent';
                if (score <= 20) return 'score-good';
                if (score <= 30) return 'score-fair';
                return 'score-poor';
            } else if (type === 'cognitive') {
                if (score >= 85) return 'score-excellent';
                if (score >= 70) return 'score-good';
                if (score >= 55) return 'score-fair';
                return 'score-poor';
            }
            return '';
        }

        function filterResults() {
            const testFilter = document.getElementById('test-filter').value;
            const sortOrder = document.getElementById('sort-order').value;

            let filtered = [...allResults];

            // Filter by test type
            if (testFilter !== 'all') {
                filtered = filtered.filter(r => r.testType === testFilter);
            }

            // Sort
            if (sortOrder === 'newest') {
                filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else {
                filtered.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            }

            displayResults(filtered);
        }

        function displayResults(results) {
            const container = document.getElementById('results-container');

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h2>No Assessment Results Found</h2>
                        <p>Complete assessments to see your results here.</p>
                        <button class="btn" onclick="window.location.href='../assessment.html'" style="margin-top: 20px;">
                            Take an Assessment
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = results.map((result, index) => {
                return renderResultCard(result, index);
            }).join('');
        }

        function renderResultCard(result, index) {
            const date = new Date(result.timestamp).toLocaleString();

            switch (result.testType) {
                case 'SymptomChecklist':
                    return renderSymptomResult(result, date, index);
                case 'BESS':
                    return renderBESSResult(result, date, index);
                case 'VOMS':
                    return renderVOMSResult(result, date, index);
                case 'ReactionTime':
                    return renderReactionResult(result, date, index);
                case 'Cognitive':
                    return renderCognitiveResult(result, date, index);
                default:
                    return '';
            }
        }

        function renderSymptomResult(result, date, index) {
            const scoreClass = getScoreClass('symptom', result.totalScore);
            return `
                <div class="result-card">
                    <div class="result-header">
                        <div>
                            <div class="result-type">🩺 Symptom Checklist</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteResult(${index})">Delete</button>
                    </div>

                    <div class="result-score ${scoreClass}">
                        Total Score: ${result.totalScore} / ${result.maxScore}
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Severity:</strong> ${result.interpretation}
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Physical</div>
                            <div class="stat-value">${result.categoryScores.physical}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Cognitive</div>
                            <div class="stat-value">${result.categoryScores.cognitive}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Emotional</div>
                            <div class="stat-value">${result.categoryScores.emotional}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Sleep</div>
                            <div class="stat-value">${result.categoryScores.sleep}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBESSResult(result, date, index) {
            const scoreClass = getScoreClass('bess', result.totalScore);
            return `
                <div class="result-card">
                    <div class="result-header">
                        <div>
                            <div class="result-type">⚖️ Balance Assessment (BESS)</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteResult(${index})">Delete</button>
                    </div>

                    <div class="result-score ${scoreClass}">
                        Total Errors: ${result.totalScore}
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Performance:</strong> ${result.interpretation}
                    </div>

                    <table>
                        <thead>
                            <tr><th>Stance</th><th>Errors</th></tr>
                        </thead>
                        <tbody>
                            ${result.stanceErrors.map(stance => `
                                <tr>
                                    <td>${stance.stance}</td>
                                    <td>${stance.errors}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderVOMSResult(result, date, index) {
            return `
                <div class="result-card">
                    <div class="result-header">
                        <div>
                            <div class="result-type">👁️ VOMS Assessment</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteResult(${index})">Delete</button>
                    </div>

                    <div class="result-score">
                        Avg Provocation: +${result.averageProvocation.toFixed(1)}
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Result:</strong> ${result.interpretation}
                    </div>

                    <table>
                        <thead>
                            <tr><th>Test</th><th>Symptom Change</th></tr>
                        </thead>
                        <tbody>
                            ${Object.entries(result.provocationScores).map(([test, score]) => `
                                <tr>
                                    <td>${test}</td>
                                    <td>+${score}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderReactionResult(result, date, index) {
            return `
                <div class="result-card">
                    <div class="result-header">
                        <div>
                            <div class="result-type">⚡ Reaction Time Test</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteResult(${index})">Delete</button>
                    </div>

                    <div class="result-score">
                        Mean RT: ${result.meanRT} ms
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Performance:</strong> ${result.interpretation}
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Mean</div>
                            <div class="stat-value">${result.meanRT} ms</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Median</div>
                            <div class="stat-value">${result.medianRT} ms</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Fastest</div>
                            <div class="stat-value">${result.fastest} ms</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Misses</div>
                            <div class="stat-value">${result.misses}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCognitiveResult(result, date, index) {
            const scoreClass = getScoreClass('cognitive', result.compositeScore);
            return `
                <div class="result-card">
                    <div class="result-header">
                        <div>
                            <div class="result-type">🧠 Cognitive Assessment</div>
                            <div class="result-date">${date}</div>
                        </div>
                        <button class="btn btn-danger" onclick="deleteResult(${index})">Delete</button>
                    </div>

                    <div class="result-score ${scoreClass}">
                        Composite Score: ${result.compositeScore}%
                    </div>
                    <div style="margin: 10px 0;">
                        <strong>Performance:</strong> ${result.interpretation}
                    </div>

                    <table>
                        <thead>
                            <tr><th>Test</th><th>Score</th></tr>
                        </thead>
                        <tbody>
                            ${result.detailedScores.immediateRecall ? `
                                <tr>
                                    <td>Immediate Recall</td>
                                    <td>${result.detailedScores.immediateRecall.percentage}%</td>
                                </tr>
                            ` : ''}
                            ${result.detailedScores.delayedRecall ? `
                                <tr>
                                    <td>Delayed Recall</td>
                                    <td>${result.detailedScores.delayedRecall.percentage}%</td>
                                </tr>
                            ` : ''}
                            ${result.detailedScores.digitSpanForward ? `
                                <tr>
                                    <td>Digit Span Forward</td>
                                    <td>${result.detailedScores.digitSpanForward.maxLevel} digits</td>
                                </tr>
                            ` : ''}
                            ${result.detailedScores.digitSpanBackward ? `
                                <tr>
                                    <td>Digit Span Backward</td>
                                    <td>${result.detailedScores.digitSpanBackward.maxLevel} digits</td>
                                </tr>
                            ` : ''}
                            ${result.detailedScores.processingSpeed ? `
                                <tr>
                                    <td>Processing Speed</td>
                                    <td>${result.detailedScores.processingSpeed.percentage}%</td>
                                </tr>
                            ` : ''}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function deleteResult(index) {
            if (confirm('Are you sure you want to delete this result? This cannot be undone.')) {
                allResults.splice(index, 1);
                localStorage.setItem('concussionAssessments', JSON.stringify(allResults));
                loadResults();
            }
        }

        function clearAllResults() {
            if (confirm('Are you sure you want to delete ALL assessment results? This cannot be undone.')) {
                if (confirm('This will permanently delete all your assessment data. Are you ABSOLUTELY sure?')) {
                    localStorage.removeItem('concussionAssessments');
                    allResults = [];
                    loadResults();
                }
            }
        }

        function exportResults() {
            const dataStr = JSON.stringify(allResults, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `concussion-assessment-results-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // Initialize
        loadResults();
    </script>
</body>
</html>
