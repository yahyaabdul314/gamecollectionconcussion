<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VR Concussion Recovery</title>
    <!-- Build: v1.2 - Functions BEFORE external scripts -->
    <link rel="stylesheet" href="styles.css">

    <!-- DEFINE CRITICAL FUNCTIONS FIRST - BEFORE ANY EXTERNAL SCRIPTS -->
    <script>
        console.log('🚀 Defining functions...');

        // Global variables
        let authManager;

        // Switch between signin and signup tabs
        function switchTab(tab) {
            console.log('✅ switchTab called:', tab);

            const tabs = document.querySelectorAll('.auth-tab');
            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'signin') {
                tabs[0].classList.add('active');
            } else {
                tabs[1].classList.add('active');
            }

            const forms = document.querySelectorAll('.auth-form');
            forms.forEach(f => f.classList.remove('active'));

            if (tab === 'signin') {
                document.getElementById('signinForm').classList.add('active');
            } else {
                document.getElementById('signupForm').classList.add('active');
            }

            hideMessages();
        }

        // Show error message
        function showError(message) {
            console.log('❌ Error:', message);
            const errorEl = document.getElementById('errorMessage');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                setTimeout(() => errorEl.style.display = 'none', 5000);
            }
        }

        // Show success message
        function showSuccess(message) {
            console.log('✅ Success:', message);
            const successEl = document.getElementById('successMessage');
            if (successEl) {
                successEl.textContent = message;
                successEl.style.display = 'block';
            }
        }

        // Hide all messages
        function hideMessages() {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            if (errorEl) errorEl.style.display = 'none';
            if (successEl) successEl.style.display = 'none';
        }

        // GUEST MODE - MUST ALWAYS WORK
        function continueAsGuest() {
            console.log('🎮 GUEST MODE: Starting...');

            try {
                localStorage.setItem('guestMode', 'true');
                localStorage.setItem('guestUser', JSON.stringify({
                    id: 'guest-' + Date.now(),
                    email: 'guest@local',
                    name: 'Guest User'
                }));

                console.log('✅ Guest data saved');
                showSuccess('Guest mode activated! Redirecting...');

                setTimeout(() => {
                    console.log('🚀 Redirecting to dashboard...');
                    window.location.href = 'dashboard.html';
                }, 500);
            } catch (error) {
                console.error('❌ Guest mode error:', error);
                alert('Error starting guest mode: ' + error.message);
            }
        }

        // Handle sign in
        async function handleSignIn(event) {
            event.preventDefault();
            console.log('📧 Sign in starting...');
            hideMessages();

            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;
            const btn = document.getElementById('signinBtn');

            // Check if Supabase CDN loaded
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase CDN not loaded');
                showError('Authentication system unavailable. Please use Guest Mode instead.');
                return;
            }

            // Try to initialize authManager if not set
            if (!authManager) {
                console.log('🔄 Initializing auth manager...');
                try {
                    if (typeof initSupabase === 'function') {
                        const client = initSupabase();
                        if (!client) {
                            throw new Error('Supabase client initialization failed');
                        }
                    }
                    if (typeof getAuthManager === 'function') {
                        authManager = getAuthManager();
                        if (!authManager || !authManager.supabase) {
                            throw new Error('Auth manager initialization failed');
                        }
                    } else {
                        throw new Error('getAuthManager function not found');
                    }
                } catch (error) {
                    console.error('❌ Failed to init auth:', error);
                    showError('Authentication system unavailable. Please use Guest Mode instead.');
                    return;
                }
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const result = await authManager.signIn(email, password);
                if (result.success) {
                    showSuccess('Success! Redirecting...');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showError(result.error || 'Sign in failed');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Sign in error:', error);
                showError('Sign in failed: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        // Handle sign up
        async function handleSignUp(event) {
            event.preventDefault();
            console.log('📝 Sign up starting...');
            hideMessages();

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            const btn = document.getElementById('signupBtn');

            if (password !== confirm) {
                showError('Passwords do not match');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            // Check if Supabase CDN loaded
            if (typeof supabase === 'undefined') {
                console.error('❌ Supabase CDN not loaded');
                showError('Authentication system unavailable. Please use Guest Mode instead.');
                return;
            }

            // Try to initialize authManager if not set
            if (!authManager) {
                console.log('🔄 Initializing auth manager...');
                try {
                    if (typeof initSupabase === 'function') {
                        const client = initSupabase();
                        if (!client) {
                            throw new Error('Supabase client initialization failed');
                        }
                    }
                    if (typeof getAuthManager === 'function') {
                        authManager = getAuthManager();
                        if (!authManager || !authManager.supabase) {
                            throw new Error('Auth manager initialization failed');
                        }
                    } else {
                        throw new Error('getAuthManager function not found');
                    }
                } catch (error) {
                    console.error('❌ Failed to init auth:', error);
                    showError('Authentication system unavailable. Please use Guest Mode instead.');
                    return;
                }
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const result = await authManager.signUp(email, password, { name });
                if (result.success) {
                    showSuccess('Account created! Redirecting...');
                    document.getElementById('signupForm').reset();
                    setTimeout(() => window.location.href = 'dashboard.html', 1500);
                } else {
                    showError(result.error || 'Sign up failed');
                    btn.disabled = false;
                    btn.textContent = 'Sign Up';
                }
            } catch (error) {
                console.error('Sign up error:', error);
                showError('Sign up failed: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Sign Up';
            }
        }

        console.log('✅ All functions defined');
    </script>

    <!-- NOW load external scripts (won't break if these fail) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.warn('Supabase CDN failed')"></script>
    <script src="supabase-config.js" onerror="console.warn('supabase-config.js failed')"></script>

    <!-- Initialize after DOM loads -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('📄 DOM loaded');

            try {
                if (typeof initSupabase === 'function') {
                    console.log('✅ Initializing Supabase...');
                    initSupabase();
                    authManager = getAuthManager();

                    const isAuth = await authManager.isAuthenticated();
                    if (isAuth) {
                        console.log('✅ Already authenticated');
                        window.location.href = 'dashboard.html';
                        return;
                    }
                } else {
                    console.warn('⚠️ Supabase not available - guest mode only');
                }
            } catch (error) {
                console.error('❌ Init error:', error);
            }

            // Auto-trigger guest mode from URL
            if (window.location.hash === '#guest') {
                console.log('🎮 Auto-starting guest mode from URL');
                setTimeout(continueAsGuest, 500);
            }

            console.log('✅ Page ready');
        });
    </script>

    <style>
        .auth-container {
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fff3f3;
            border: 2px solid #ff6b6b;
            color: #c92a2a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            border: 2px solid #50C878;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .guest-login {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            text-align: center;
        }

        .guest-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .guest-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🧠 VR Concussion Recovery</h1>
            <p>Sign in to track your progress</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('signin')">Sign In</button>
            <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Sign In Form -->
        <form class="auth-form active" id="signinForm" onsubmit="handleSignIn(event); return false;">
            <div class="form-group">
                <label for="signin-email">Email</label>
                <input type="email" id="signin-email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="signin-password">Password</label>
                <input type="password" id="signin-password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="submit-btn" id="signinBtn">Sign In</button>
        </form>

        <!-- Sign Up Form -->
        <form class="auth-form" id="signupForm" onsubmit="handleSignUp(event); return false;">
            <div class="form-group">
                <label for="signup-name">Name (Optional)</label>
                <input type="text" id="signup-name" placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" required minlength="6" placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label for="signup-confirm">Confirm Password</label>
                <input type="password" id="signup-confirm" required placeholder="Confirm your password">
            </div>
            <button type="submit" class="submit-btn" id="signupBtn">Sign Up</button>
        </form>

        <!-- Guest Access -->
        <div class="guest-login">
            <p style="color: #666; margin-bottom: 10px; font-weight: bold;">✨ No signup needed!</p>
            <button class="guest-btn" onclick="continueAsGuest()">Continue as Guest</button>
            <p style="color: #999; font-size: 12px; margin-top: 10px;">
                Try the platform instantly - progress saved locally
            </p>
        </div>
    </div>
</body>
</html>
