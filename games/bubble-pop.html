<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Pop - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Bubble Pop</h2>
        <p>Gently pop floating bubbles at your own pace. No pressure, just relaxing coordination practice.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let bubbles = [];
        let controllers = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xB0E0E6);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Create controllers
            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, -1], 3));
                const material = new THREE.LineBasicMaterial({ color: 0xffffff });
                const line = new THREE.Line(geometry, material);
                line.scale.z = 5;
                controller.add(line);

                scene.add(controller);
                controllers.push(controller);
            }

            // Create initial bubbles
            for (let i = 0; i < 15; i++) {
                createBubble();
            }

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function createBubble() {
            const radius = 0.1 + Math.random() * 0.15;
            const geometry = new THREE.SphereGeometry(radius, 16, 16);

            // Bubble material with transparency
            const material = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.5, 0.7),
                transparent: true,
                opacity: 0.6,
                shininess: 100,
                specular: 0xffffff
            });

            const bubble = new THREE.Mesh(geometry, material);

            // Random position
            bubble.position.set(
                (Math.random() - 0.5) * 5,
                Math.random() * 3,
                -2 + (Math.random() - 0.5) * 4
            );

            // Random velocity
            bubble.userData.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.01,
                0.005 + Math.random() * 0.01,
                (Math.random() - 0.5) * 0.01
            );

            bubble.userData.radius = radius;
            bubble.userData.lifetime = Date.now();

            scene.add(bubble);
            bubbles.push(bubble);
        }

        function popBubble(bubble) {
            // Create pop effect - small particles
            for (let i = 0; i < 5; i++) {
                const particleGeometry = new THREE.SphereGeometry(0.02, 8, 8);
                const particleMaterial = new THREE.MeshBasicMaterial({
                    color: bubble.material.color,
                    transparent: true,
                    opacity: 0.8
                });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);
                particle.position.copy(bubble.position);

                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.05,
                    (Math.random() - 0.5) * 0.05
                );
                particle.userData.isParticle = true;
                particle.userData.birthTime = Date.now();

                scene.add(particle);
                bubbles.push(particle);
            }

            // Remove bubble
            scene.remove(bubble);
            const index = bubbles.indexOf(bubble);
            if (index > -1) bubbles.splice(index, 1);

            // Play pop sound
            playPopSound();

            // Create new bubble
            createBubble();
        }

        function playPopSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const now = Date.now();

            // Update bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const bubble = bubbles[i];

                if (bubble.userData.isParticle) {
                    // Update particles
                    bubble.position.add(bubble.userData.velocity);
                    bubble.material.opacity -= 0.02;

                    if (bubble.material.opacity <= 0 || now - bubble.userData.birthTime > 1000) {
                        scene.remove(bubble);
                        bubbles.splice(i, 1);
                    }
                } else {
                    // Update bubbles
                    bubble.position.add(bubble.userData.velocity);

                    // Gentle floating wobble
                    bubble.position.x += Math.sin(now * 0.001 + i) * 0.002;
                    bubble.position.z += Math.cos(now * 0.001 + i) * 0.002;

                    // Remove if too high or too old
                    if (bubble.position.y > 4 || now - bubble.userData.lifetime > 30000) {
                        scene.remove(bubble);
                        bubbles.splice(i, 1);
                        createBubble();
                    }

                    // Gentle shimmer
                    bubble.material.opacity = 0.5 + Math.sin(now * 0.003 + i) * 0.2;
                }
            }

            // Maintain minimum number of bubbles
            while (bubbles.filter(b => !b.userData.isParticle).length < 10) {
                createBubble();
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
