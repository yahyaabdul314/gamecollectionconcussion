<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Recall - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Sequence Recall</h2>
        <p>Watch numbered objects appear in sequence, then recall the order.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let sequenceObjects = [];
        let sequence = [1, 2, 3, 4, 5];
        let currentIndex = 0;
        let showTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x16213e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Create numbered positions
            const positions = [
                { x: -2, y: 2, z: -3 },
                { x: 0, y: 2.3, z: -3 },
                { x: 2, y: 2, z: -3 },
                { x: -1.5, y: 1.2, z: -3 },
                { x: 1.5, y: 1.2, z: -3 }
            ];

            sequence.forEach((num, index) => {
                const group = new THREE.Group();

                // Create sphere
                const sphereGeometry = new THREE.SphereGeometry(0.2, 32, 32);
                const sphereMaterial = new THREE.MeshStandardMaterial({
                    color: 0x0984e3,
                    emissive: 0x0984e3,
                    emissiveIntensity: 0
                });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                group.add(sphere);

                // Create number texture
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 128;
                canvas.height = 128;

                context.fillStyle = '#ffffff';
                context.font = 'Bold 80px Arial';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(num.toString(), 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const numberMaterial = new THREE.SpriteMaterial({ map: texture });
                const numberSprite = new THREE.Sprite(numberMaterial);
                numberSprite.scale.set(0.4, 0.4, 1);
                group.add(numberSprite);

                group.position.set(positions[index].x, positions[index].y, positions[index].z);
                group.userData.number = num;
                group.userData.sphere = sphere;
                group.userData.visible = false;
                group.visible = false;

                scene.add(group);
                sequenceObjects.push(group);
            });

            showTime = Date.now();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function playSound(frequency) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function render() {
            const now = Date.now();

            // Show sequence one by one
            if (now - showTime > 1500 && currentIndex < sequence.length) {
                if (currentIndex > 0) {
                    // Hide previous
                    sequenceObjects[currentIndex - 1].userData.sphere.material.emissiveIntensity = 0;
                }

                // Show current
                const current = sequenceObjects[currentIndex];
                current.visible = true;
                current.userData.sphere.material.emissiveIntensity = 0.5;

                // Play sound
                playSound(200 + currentIndex * 100);

                currentIndex++;
                showTime = now;
            }

            // Reset after showing all
            if (currentIndex >= sequence.length && now - showTime > 3000) {
                sequenceObjects.forEach(obj => {
                    obj.visible = false;
                    obj.userData.sphere.material.emissiveIntensity = 0;
                });
                currentIndex = 0;
                showTime = now;
            }

            // Gentle animation
            sequenceObjects.forEach(obj => {
                if (obj.visible) {
                    obj.rotation.y += 0.01;
                }
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
