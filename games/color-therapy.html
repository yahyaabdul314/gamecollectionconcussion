<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Therapy - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Color Therapy</h2>
        <p>Immerse yourself in slowly changing, calming colors. Each color promotes relaxation and healing.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let colorSphere;
        let particles = [];

        const THERAPY_COLORS = [
            { color: 0x87CEEB, name: 'Calm Blue', emotion: 'Peace' },
            { color: 0x90EE90, name: 'Healing Green', emotion: 'Balance' },
            { color: 0xE6E6FA, name: 'Gentle Lavender', emotion: 'Serenity' },
            { color: 0xFFB6C1, name: 'Soft Pink', emotion: 'Comfort' },
            { color: 0xF0E68C, name: 'Warm Yellow', emotion: 'Joy' },
            { color: 0xDDA0DD, name: 'Peaceful Purple', emotion: 'Mindfulness' }
        ];

        let currentColorIndex = 0;
        let colorChangeTime = Date.now() + 8000;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(THERAPY_COLORS[0].color);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            // Create central color sphere
            const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
            const sphereMaterial = new THREE.MeshBasicMaterial({
                color: THERAPY_COLORS[0].color,
                transparent: true,
                opacity: 0.3,
                wireframe: true
            });
            colorSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            colorSphere.position.set(0, 1.6, -3);
            scene.add(colorSphere);

            // Create floating particles
            for (let i = 0; i < 50; i++) {
                const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
                const particleMaterial = new THREE.MeshBasicMaterial({
                    color: THERAPY_COLORS[0].color,
                    transparent: true,
                    opacity: 0.6
                });
                const particle = new THREE.Mesh(particleGeometry, particleMaterial);

                particle.position.set(
                    (Math.random() - 0.5) * 10,
                    Math.random() * 4,
                    -5 + (Math.random() - 0.5) * 8
                );

                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.01
                );

                scene.add(particle);
                particles.push(particle);
            }

            // Create surrounding color environment
            const skyGeometry = new THREE.SphereGeometry(20, 32, 32);
            const skyMaterial = new THREE.MeshBasicMaterial({
                color: THERAPY_COLORS[0].color,
                side: THREE.BackSide,
                transparent: true,
                opacity: 0.5
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(sky);

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function transitionToNextColor() {
            currentColorIndex = (currentColorIndex + 1) % THERAPY_COLORS.length;
            const newColor = THERAPY_COLORS[currentColorIndex].color;

            // Transition all colors smoothly
            colorSphere.material.color.setHex(newColor);
            scene.background.setHex(newColor);

            particles.forEach(particle => {
                particle.material.color.setHex(newColor);
            });

            colorChangeTime = Date.now() + 8000; // 8 seconds per color
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const now = Date.now();

            // Change color periodically
            if (now > colorChangeTime) {
                transitionToNextColor();
            }

            // Rotate color sphere
            colorSphere.rotation.y += 0.002;
            colorSphere.rotation.x += 0.001;

            // Gentle pulse
            const pulse = 1 + Math.sin(now * 0.001) * 0.1;
            colorSphere.scale.set(pulse, pulse, pulse);

            // Update particles
            particles.forEach((particle, index) => {
                particle.position.add(particle.userData.velocity);

                // Gentle floating motion
                const offset = index * 0.5;
                particle.position.y += Math.sin(now * 0.0005 + offset) * 0.001;

                // Boundary check
                if (Math.abs(particle.position.x) > 5) particle.userData.velocity.x *= -1;
                if (particle.position.y > 4 || particle.position.y < 0) particle.userData.velocity.y *= -1;
                if (Math.abs(particle.position.z) > 5) particle.userData.velocity.z *= -1;

                // Gentle pulse
                const particlePulse = 1 + Math.sin(now * 0.002 + offset) * 0.3;
                particle.scale.set(particlePulse, particlePulse, particlePulse);
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
