<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Memory - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Spatial Memory</h2>
        <p>Objects will appear briefly. Remember their positions in 3D space.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let targetObjects = [];
        let gameState = 'showing'; // showing, hidden, complete
        let showTime = 5000;
        let stateChangeTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2d3436);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Create grid floor for reference
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Create spatial objects to remember
            const shapes = ['box', 'sphere', 'cone'];
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];

            for (let i = 0; i < 5; i++) {
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];

                let geometry;
                if (shape === 'box') {
                    geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                } else if (shape === 'sphere') {
                    geometry = new THREE.SphereGeometry(0.12, 16, 16);
                } else {
                    geometry = new THREE.ConeGeometry(0.12, 0.25, 16);
                }

                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.2
                });

                const object = new THREE.Mesh(geometry, material);

                // Random position in a reasonable space
                object.position.set(
                    (Math.random() - 0.5) * 4,
                    0.5 + Math.random() * 2,
                    -2 + (Math.random() - 0.5) * 3
                );

                object.userData.visible = true;
                scene.add(object);
                targetObjects.push(object);
            }

            stateChangeTime = Date.now() + showTime;

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const now = Date.now();

            if (gameState === 'showing' && now > stateChangeTime) {
                // Hide objects
                gameState = 'hidden';
                targetObjects.forEach(obj => {
                    obj.visible = false;
                });
                stateChangeTime = now + 5000; // Show again after 5 seconds
            } else if (gameState === 'hidden' && now > stateChangeTime) {
                // Show objects again
                gameState = 'showing';
                targetObjects.forEach(obj => {
                    obj.visible = true;
                });
                stateChangeTime = now + showTime;
            }

            // Gentle rotation on visible objects
            targetObjects.forEach(obj => {
                if (obj.visible) {
                    obj.rotation.y += 0.01;
                }
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
