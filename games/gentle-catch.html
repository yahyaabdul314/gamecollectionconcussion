<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentle Catch - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Gentle Catch</h2>
        <p>Catch slowly falling objects to improve hand-eye coordination. Take your time!</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let fallingObjects = [];
        let catchZone;
        let nextSpawnTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffd89b);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Create catch zone (visual indicator)
            const catchGeometry = new THREE.RingGeometry(0.3, 0.4, 32);
            const catchMaterial = new THREE.MeshBasicMaterial({
                color: 0x00ff00,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.5
            });
            catchZone = new THREE.Mesh(catchGeometry, catchMaterial);
            catchZone.rotation.x = -Math.PI / 2;
            catchZone.position.set(0, 0.8, -1);
            scene.add(catchZone);

            // Add floor
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x90EE90,
                roughness: 0.9
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function spawnFallingObject() {
            const shapes = ['sphere', 'cube', 'star'];
            const shape = shapes[Math.floor(Math.random() * shapes.length)];

            let geometry;
            if (shape === 'sphere') {
                geometry = new THREE.SphereGeometry(0.15, 16, 16);
            } else if (shape === 'cube') {
                geometry = new THREE.BoxGeometry(0.25, 0.25, 0.25);
            } else {
                // Star shape (using tetrahedron as simplified star)
                geometry = new THREE.TetrahedronGeometry(0.2);
            }

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6),
                emissive: new THREE.Color().setHSL(Math.random(), 0.5, 0.3),
                emissiveIntensity: 0.3
            });

            const object = new THREE.Mesh(geometry, material);

            // Start position above the catch zone
            object.position.set(
                catchZone.position.x + (Math.random() - 0.5) * 0.5,
                3,
                catchZone.position.z + (Math.random() - 0.5) * 0.5
            );

            object.userData.fallSpeed = 0.008 + Math.random() * 0.004; // Slow fall
            object.userData.rotationSpeed = {
                x: (Math.random() - 0.5) * 0.02,
                y: (Math.random() - 0.5) * 0.02,
                z: (Math.random() - 0.5) * 0.02
            };

            scene.add(object);
            fallingObjects.push(object);
        }

        function checkCatch(object) {
            const distance = Math.sqrt(
                Math.pow(object.position.x - catchZone.position.x, 2) +
                Math.pow(object.position.z - catchZone.position.z, 2)
            );

            return distance < 0.4 && object.position.y <= catchZone.position.y + 0.2;
        }

        function catchObject(object) {
            // Visual feedback
            object.material.emissive.setHex(0xffff00);
            object.material.emissiveIntensity = 1;

            // Play catch sound
            playCatchSound();

            // Animate caught object
            setTimeout(() => {
                scene.remove(object);
                const index = fallingObjects.indexOf(object);
                if (index > -1) fallingObjects.splice(index, 1);
            }, 300);
        }

        function playCatchSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 523; // C note
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const now = Date.now();

            // Spawn new objects periodically
            if (now > nextSpawnTime && fallingObjects.length < 5) {
                spawnFallingObject();
                nextSpawnTime = now + 2000 + Math.random() * 2000; // 2-4 seconds
            }

            // Update falling objects
            for (let i = fallingObjects.length - 1; i >= 0; i--) {
                const object = fallingObjects[i];

                // Fall down
                object.position.y -= object.userData.fallSpeed;

                // Rotate
                object.rotation.x += object.userData.rotationSpeed.x;
                object.rotation.y += object.userData.rotationSpeed.y;
                object.rotation.z += object.userData.rotationSpeed.z;

                // Check if caught
                if (checkCatch(object)) {
                    catchObject(object);
                }
                // Remove if hit ground
                else if (object.position.y < 0) {
                    scene.remove(object);
                    fallingObjects.splice(i, 1);
                }
            }

            // Animate catch zone
            const pulse = 1 + Math.sin(now * 0.003) * 0.1;
            catchZone.scale.set(pulse, pulse, pulse);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
