<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Touch - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Target Touch</h2>
        <p>Touch targets that appear around you in sequence. Practice reaching and coordination.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let activeTarget = null;
        let nextTargetTime = 0;
        let score = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3d5a80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Add reference grid
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function createTarget() {
            // Remove old target
            if (activeTarget) {
                scene.remove(activeTarget);
            }

            // Create new target
            const geometry = new THREE.SphereGeometry(0.2, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0xff6b6b,
                emissive: 0xff0000,
                emissiveIntensity: 0.5
            });

            activeTarget = new THREE.Mesh(geometry, material);

            // Random position around user
            const distance = 1 + Math.random() * 1.5;
            const angle = Math.random() * Math.PI * 2;
            const height = 1 + Math.random() * 1.2;

            activeTarget.position.set(
                Math.sin(angle) * distance,
                height,
                Math.cos(angle) * distance
            );

            activeTarget.userData.birthTime = Date.now();
            activeTarget.userData.lifetime = 5000; // 5 seconds to touch

            // Add ring indicator
            const ringGeometry = new THREE.RingGeometry(0.25, 0.3, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xffff00,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);

            // Orient ring to face camera
            ring.lookAt(camera.position);
            ring.position.copy(activeTarget.position);

            activeTarget.userData.ring = ring;
            scene.add(ring);
            scene.add(activeTarget);

            playTargetSound();
        }

        function playTargetSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 440;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const now = Date.now();

            // Create target if needed
            if (!activeTarget && now > nextTargetTime) {
                createTarget();
                nextTargetTime = now + 6000;
            }

            // Update active target
            if (activeTarget) {
                const age = now - activeTarget.userData.birthTime;

                // Pulse effect
                const scale = 1 + Math.sin(now * 0.005) * 0.2;
                activeTarget.scale.set(scale, scale, scale);

                // Update ring
                if (activeTarget.userData.ring) {
                    const ringScale = 1 + Math.sin(now * 0.003) * 0.1;
                    activeTarget.userData.ring.scale.set(ringScale, ringScale, ringScale);
                    activeTarget.userData.ring.lookAt(camera.position);

                    // Fade out ring as time passes
                    const fadeProgress = age / activeTarget.userData.lifetime;
                    activeTarget.userData.ring.material.opacity = 0.6 * (1 - fadeProgress);
                }

                // Remove if expired
                if (age > activeTarget.userData.lifetime) {
                    if (activeTarget.userData.ring) {
                        scene.remove(activeTarget.userData.ring);
                    }
                    scene.remove(activeTarget);
                    activeTarget = null;
                    nextTargetTime = now + 2000;
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
