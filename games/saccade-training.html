<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saccade Training - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Saccade Training</h2>
        <p>Practice quick eye movements between targets. A target will light up - look at it quickly, then wait for the next one.</p>
        <p><strong>Tip:</strong> Move only your eyes, not your head.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let targets = [];
        let activeTarget = null;
        let nextTargetTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Create target positions in a grid pattern
            const positions = [
                { x: -2, y: 2, z: -3 },
                { x: 0, y: 2, z: -3 },
                { x: 2, y: 2, z: -3 },
                { x: -2, y: 1.6, z: -3 },
                { x: 0, y: 1.6, z: -3 },
                { x: 2, y: 1.6, z: -3 },
                { x: -2, y: 1, z: -3 },
                { x: 0, y: 1, z: -3 },
                { x: 2, y: 1, z: -3 }
            ];

            positions.forEach(pos => {
                const geometry = new THREE.SphereGeometry(0.1, 16, 16);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x444444,
                    emissive: 0x222222
                });
                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(pos.x, pos.y, pos.z);
                scene.add(sphere);
                targets.push(sphere);
            });

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function activateRandomTarget() {
            // Deactivate previous target
            if (activeTarget) {
                activeTarget.material.color.setHex(0x444444);
                activeTarget.material.emissive.setHex(0x222222);
                activeTarget.material.emissiveIntensity = 1;
            }

            // Activate new random target
            activeTarget = targets[Math.floor(Math.random() * targets.length)];
            activeTarget.material.color.setHex(0x00ff00);
            activeTarget.material.emissive.setHex(0x00ff00);
            activeTarget.material.emissiveIntensity = 0.5;

            // Play sound
            playSound(440, 0.1);
        }

        function playSound(frequency, duration) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function render() {
            const now = Date.now();

            if (now > nextTargetTime) {
                activateRandomTarget();
                nextTargetTime = now + 2000; // 2 seconds between targets
            }

            // Gentle pulse on active target
            if (activeTarget) {
                const scale = 1 + Math.sin(Date.now() * 0.005) * 0.2;
                activeTarget.scale.set(scale, scale, scale);
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
