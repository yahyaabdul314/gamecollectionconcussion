<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Pursuit - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>Smooth Pursuit Training</h2>
        <p>Follow the moving sphere with your eyes. The sphere will move slowly in different patterns to help rebuild smooth eye tracking abilities.</p>
        <p><strong>Tip:</strong> Keep your head still and only move your eyes.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let targetSphere, path, pathIndex = 0;
        let speed = 0.002;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Create target sphere
            const geometry = new THREE.SphereGeometry(0.15, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0xFF4444,
                emissive: 0xFF0000,
                emissiveIntensity: 0.3
            });
            targetSphere = new THREE.Mesh(geometry, material);
            targetSphere.position.set(0, 1.6, -3);
            scene.add(targetSphere);

            // Create circular path
            const radius = 1.5;
            path = [];
            for (let i = 0; i < 360; i += 2) {
                const angle = (i * Math.PI) / 180;
                path.push({
                    x: Math.sin(angle) * radius,
                    y: 1.6 + Math.cos(angle) * radius * 0.5,
                    z: -3
                });
            }

            // Add reference grid
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start animation
            renderer.setAnimationLoop(render);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            // Move target along path
            pathIndex = (pathIndex + 1) % path.length;
            const target = path[pathIndex];

            targetSphere.position.x += (target.x - targetSphere.position.x) * speed * 100;
            targetSphere.position.y += (target.y - targetSphere.position.y) * speed * 100;
            targetSphere.position.z += (target.z - targetSphere.position.z) * speed * 100;

            // Gentle pulsing effect
            const scale = 1 + Math.sin(Date.now() * 0.002) * 0.1;
            targetSphere.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
