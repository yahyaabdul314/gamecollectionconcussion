<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Assembly - Concussion Recovery</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="vr-container">
    <a href="../index.html" class="back-button">← Back to Games</a>

    <div class="vr-info">
        <h2>3D Puzzle Assembly</h2>
        <p>Watch as puzzle pieces rotate. Observe how they could fit together to form a complete shape.</p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/webxr/VRButton.js';

        let scene, camera, renderer;
        let puzzlePieces = [];
        let assembled = false;
        let assemblyTime = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e3a5f);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Create a simple puzzle - a cube split into pieces
            const colors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x95e1d3];
            const pieceSize = 0.4;

            // Create 4 pieces of a larger cube
            for (let i = 0; i < 4; i++) {
                const geometry = new THREE.BoxGeometry(pieceSize, pieceSize, pieceSize);
                const material = new THREE.MeshStandardMaterial({
                    color: colors[i],
                    emissive: colors[i],
                    emissiveIntensity: 0.2
                });

                const piece = new THREE.Mesh(geometry, material);

                // Initial scattered positions
                const angle = (i / 4) * Math.PI * 2;
                piece.position.set(
                    Math.sin(angle) * 1.5,
                    1.6 + Math.cos(angle * 2) * 0.5,
                    -2
                );

                // Target assembled position
                const col = i % 2;
                const row = Math.floor(i / 2);
                piece.userData.targetPosition = new THREE.Vector3(
                    (col - 0.5) * pieceSize,
                    1.6 + (row - 0.5) * pieceSize,
                    -2
                );

                piece.userData.targetRotation = new THREE.Euler(0, 0, 0);

                scene.add(piece);
                puzzlePieces.push(piece);
            }

            // Add assembly target outline
            const outlineGeometry = new THREE.BoxGeometry(pieceSize * 2.1, pieceSize * 2.1, pieceSize * 1.1);
            const outlineMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
            outline.position.set(0, 1.6, -2);
            scene.add(outline);

            assemblyTime = Date.now() + 5000; // Assemble after 5 seconds

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            const now = Date.now();

            if (!assembled && now > assemblyTime) {
                assembled = true;
            }

            puzzlePieces.forEach((piece, index) => {
                if (assembled) {
                    // Move pieces to assembled position
                    piece.position.lerp(piece.userData.targetPosition, 0.02);
                    piece.rotation.x += (piece.userData.targetRotation.x - piece.rotation.x) * 0.05;
                    piece.rotation.y += (piece.userData.targetRotation.y - piece.rotation.y) * 0.05;
                    piece.rotation.z += (piece.userData.targetRotation.z - piece.rotation.z) * 0.05;
                } else {
                    // Rotate pieces while scattered
                    piece.rotation.x += 0.01;
                    piece.rotation.y += 0.015;

                    // Gentle floating
                    const offset = index * 1.2;
                    const floatY = Math.sin(now * 0.001 + offset) * 0.2;
                    piece.position.y += floatY * 0.01;
                }
            });

            // Check if assembly is complete and restart
            if (assembled) {
                const allAssembled = puzzlePieces.every(piece =>
                    piece.position.distanceTo(piece.userData.targetPosition) < 0.01
                );

                if (allAssembled && now > assemblyTime + 3000) {
                    // Reset to scattered positions
                    assembled = false;
                    assemblyTime = now + 5000;

                    puzzlePieces.forEach((piece, i) => {
                        const angle = (i / 4) * Math.PI * 2;
                        piece.position.set(
                            Math.sin(angle) * 1.5,
                            1.6 + Math.cos(angle * 2) * 0.5,
                            -2
                        );
                    });
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
